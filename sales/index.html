<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- THEME, BEFORE THE FIRST STYLESHEET. This has to be an inline blocking script in the
       head and it has to be here, above the CSS: the browser paints as soon as it can, so a
       theme applied from app.js at the bottom of the body gives every dark-mode user a white
       flash on every single page load. Reading one localStorage key and setting one
       attribute costs well under a millisecond and is the standard cure.
       No stored value means no attribute, which is the "match my system" state and is
       resolved by prefers-color-scheme in styles.css. try/catch because a browser with site
       data blocked throws on the read, and a theme preference is not worth a blank page. -->
  <script>
    try {
      var t = localStorage.getItem('vej_theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
