<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Theme must be applied before the first stylesheet or dark mode users get a white flash. No stored value means follow the system. -->
  <script>
    try {
      var t = localStorage.getItem('vej_theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progreaux Sales OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css?v=d7169079" />
  <link rel="stylesheet" href="styles.css?v=be541876" />
  <link rel="stylesheet" href="pipeline.css?v=2fa671ba" />
  <link rel="stylesheet" href="reports.css?v=c874cd53" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">PG</div>
        <div class="brand-text">
          <strong>Sales OS</strong>
          <!-- BRAND: Progreaux -->
          <span>Progreaux</span>
        </div>
      </div>
      <nav class="nav" id="nav"><!-- injected --></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">☰</button>
        <div class="topbar-title" id="topbarTitle">Leads</div>
        <div class="topbar-actions">
          <button class="btn btn-ghost gs-open" id="gsOpen" onclick="openSearch()" aria-label="Search everything">
            <span class="gs-ic">⌕</span><span class="gs-t">Search</span><kbd>/</kbd>
          </button>
          <span class="role-chip" id="roleChip" hidden></span>
          <button class="btn btn-ghost theme-btn" id="themeBtn" onclick="cycleTheme()"
                  aria-label="Switch between light, dark and system theme"><span id="themeIc">◐</span></button>
          <button class="btn btn-ghost" onclick="window.print()">Print / Export</button>
        </div>
      </header>
      <div class="content" id="content"><!-- injected --></div>
    </main>
  </div>

  <div class="toast" id="toast">Copied to clipboard</div>

  <!-- Load order: data, pipeline, outreach facts, reports, the two copy editors, summary, then app -->
  <script src="data.js?v=8e5e4151"></script>
  <script src="pipeline-data.js?v=c40b0c1b"></script>
  <!-- roster-data.js (2.1 MB) is fetched on demand by app.js; this span carries its stamped URL. Do not make it a script tag. -->
  <span id="rosterSrc" hidden data-src="roster-data.js?v=4d2b7eb1"></span>
  <script src="hubspot-data.js?v=2b77b695"></script>
  <script src="hubspot-comms.js?v=c969930f"></script>
  <script src="pipeline.js?v=3afcebe4"></script>
  <script src="outreach-data.js?v=ee28a126"></script>
  <script src="instantly-data.js?v=0428cae7"></script>
  <script src="reports.js?v=d91430d9"></script>
  <script src="copy-editor.js?v=e7ef65bd"></script>
  <script src="coldemail-spec.js?v=cb8a03c1"></script>
  <script src="coldemail.js?v=dccc881b"></script>
  <script src="nurture-data.js?v=65105c2a"></script>
  <script src="email-template.js?v=0c113b63"></script>
  <script src="nurture-spec.js?v=9bdae0d1"></script>
  <script src="nurture.js?v=69f970a9"></script>
  <script src="summary.js?v=43881710"></script>
  <script src="app.js?v=5dfc865f"></script>
</body>
</html>
